# =============================================================================
# A/B 路由网关 —— P3 灰度替换统一入口（可选独立部署）
#
# 注意：默认部署方式是 Go 内嵌前端，本配置仅用于 docker-compose --profile web-next。
#
# 路由策略（与 web-next/__flags/runtime.json 配合）：
#  - /          → web-next（前端内部按 flags 决定是否走新前端）
#  - /web-next/ → web-next 直通
#  - /legacy    → 410 Gone（旧 web 已下线，仅保留回退路径）
#  - /__flags/  → web-next 直通（运维读 flags 用）
#  - /api/      → 后端
#  - /assets/   → web-next 静态（带 hash 长缓存）
#  - 其它       → 404
#
# upstream 使用 compose 服务名（Docker DNS 解析），无需环境变量模板渲染。
# 灰度切换：
#  - 改 runtime.json（挂载到 web-next 容器），刷新即生效
#  - 临时全量回滚：runtime.json 设 new-web=false
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream novaveil {
    server novaveil:8080;
    keepalive 32;
}

upstream web_next {
    server novaveil-web-next:8080;
    keepalive 16;
}

server {
    listen 80 default_server;
    server_name _;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain text/css text/javascript
        application/javascript application/json
        image/svg+xml;

    # ---- 健康检查 ----
    location = /healthz {
        access_log off;
        return 200 "router-ok\n";
        add_header Content-Type text/plain;
    }

    # ---- 旧 web 下线标记：410 Gone ----
    # 30 天后整体清除（历史规划，见 git 历史 docs/frontend-redesign/PLAN.md）
    location /legacy {
        access_log off;
        return 410 "Legacy web UI is retired. Please use the new console at /. Contact ops to adjust rollout.\n";
        add_header Content-Type text/plain always;
    }

    # ---- 静态资源（带 hash 长缓存）----
    location /assets/ {
        proxy_pass http://web_next;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # ---- 特性开关（运维读用）----
    location /__flags/ {
        proxy_pass http://web_next;
        proxy_set_header Host $host;
        add_header Cache-Control "no-store" always;
    }

    # ---- API 反代 ----
    location /api/ {
        proxy_pass http://novaveil;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";
        keepalive_timeout 60s;
        # SSE
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
        proxy_connect_timeout 10s;
    }

    # ---- / 与 /web-next/ → web-next ----
    # web-next 内部按 flags 决定是渲染新前端还是显示回退提示。
    location / {
        proxy_pass http://web_next;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";
        proxy_http_version 1.1;
    }

    location = /web-next {
        return 301 /;
    }

    location /web-next/ {
        proxy_pass http://web_next;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
