# =============================================================================
# web-next nginx 配置（模板）
#  - 静态资源服务（SPA fallback 到 index.html）
#  - /api/* 反代到 NOVAVEIL_UPSTREAM（后端）
#  - /healthz 健康检查
#  - /__flags/* 公开特性开关（JSON 静态文件）
#  - SSE（/api/v1/log/overview/stream）需要禁用缓冲 + 长连接
#
# 本文件作为模板挂载到 /etc/nginx/templates/default.conf.template，
# 由官办 nginx 镜像内置的 envsubst 入口点在启动时渲染到
# /etc/nginx/conf.d/default.conf。envsubst 只替换实际存在的环境变量，
# nginx 内置变量（$host / $remote_addr / $http_upgrade 等）不受影响。
#
# 环境变量：
#   NOVAVEIL_UPSTREAM  后端地址（默认 novaveil:8080，见 Dockerfile ENV）
# =============================================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 上游：后端 API
upstream novaveil {
    server $NOVAVEIL_UPSTREAM;
    keepalive 32;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ---- 安全头 ----
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # CSP：script-src 不含 unsafe-inline（审计 FE-03/F-M3）；style-src 保留
    # unsafe-inline 仅用于 Vite/运行时注入的内联样式，脚本不允许内联。
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;

    # ---- gzip ----
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ---- 健康检查 ----
    location = /healthz {
        access_log off;
        # nginx add_header 继承规则：location 内一旦出现 add_header，
        # server 级安全头全部失效，因此这里显式重复一份。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ---- 特性开关（公开 JSON，无缓存）----
    location /__flags/ {
        # location 内出现 add_header 后需重复安全头，保证 server 级 CSP 不丢失。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;
        add_header Cache-Control "no-store" always;
        add_header Access-Control-Allow-Origin "*" always;
        types { application/json json; }
        default_type application/json;
    }

    # ---- API 反代 ----
    location /api/ {
        proxy_pass http://novaveil;
        proxy_http_version 1.1;

        # 透传客户端信息
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 保持长连接（web-next 的 react-query 重用连接）
        proxy_set_header Connection        "";
        keepalive_timeout 60s;

        # SSE（/api/v1/log/overview/stream 等）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout  24h;
        proxy_send_timeout  24h;
        proxy_connect_timeout 10s;
    }

    # ---- 静态资源：长缓存（带 hash 文件名）----
    location /assets/ {
        expires 1y;
        # 同上：location 自带 add_header，必须重复安全头，否则 /assets/ 丢 CSP。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;
        add_header Cache-Control "public, immutable" always;
        try_files $uri =404;
    }

    # ---- 其它静态（favicon 等）----
    location ~* \.(ico|svg|png|jpg|jpeg|webp|woff2?)$ {
        expires 30d;
        # 同上：静态资源 location 也不能丢失 server 级安全头。
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self';" always;
        add_header Cache-Control "public" always;
        try_files $uri =404;
    }

    # ---- SPA fallback：所有未匹配的路径返回 index.html ----
    #  注意：/api/ 与 /__flags/ 已在上方精确匹配
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 隐藏 nginx 版本
    server_tokens off;
}
