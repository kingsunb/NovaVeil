version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  # web-next 使用 pnpm 管理；lockfile 为 web-next/pnpm-lock.yaml。
  - package-ecosystem: npm
    directory: "/web-next"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"
    ignore:
      # typescript-eslint 尚不支持 TS 7
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # 运行时为 Node 22, 类型需对齐
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]