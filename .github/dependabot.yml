version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      go-dependencies:
        patterns:
          - "*"

  # web-next 使用 pnpm 管理；lockfile 为 web-next/pnpm-lock.yaml。
  - package-ecosystem: npm
    directory: "/web-next"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    groups:
      frontend-dependencies:
        patterns:
          - "*"