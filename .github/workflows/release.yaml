name: release

# 手动触发：仅在明确发版时运行，构建 Windows exe 并创建 GitHub Release。
# 普通提交与 tag 推送都不会触发；Docker 镜像发布见 docker-publish，保持原样。
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不含 v 前缀，如 1.0.0）'
        required: true
        type: string
      prerelease:
        description: '标记为预发布（Pre-release）'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-manual
  cancel-in-progress: false

jobs:
  windows-release:
    name: Build Windows exe and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '11.21.0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.5'
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.4'
          cache: true

      - name: Resolve version
        id: ver
        shell: bash
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${RAW_VERSION#v}"
          if ! [[ "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.]+)?$ ]]; then
            echo "invalid version: ${RAW_VERSION}" >&2
            exit 1
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "tag=v${version}" >>"${GITHUB_OUTPUT}"
          echo "commit=${GITHUB_SHA::7}" >>"${GITHUB_OUTPUT}"

      - name: Test Go packages
        run: go test -count=1 -timeout=10m ./...

      - name: Build frontend and Windows exe archive
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          COMMIT: ${{ steps.ver.outputs.commit }}
        run: bash scripts/build.sh --targets windows/amd64

      - name: Verify release archive
        run: |
          set -euo pipefail
          test -f build/archives/novaveil-windows-amd64.zip
          (cd build/archives && sha256sum -c SHA256SUMS)
          unzip -l build/archives/novaveil-windows-amd64.zip | grep -q 'novaveil.exe'

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          assets=(build/archives/novaveil-windows-amd64.zip build/archives/SHA256SUMS)
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${assets[@]}" --clobber
          else
            args=(--title "NovaVeil ${TAG}" --target "${GITHUB_SHA}" --generate-notes)
            if [ "${PRERELEASE}" = "true" ]; then args+=(--prerelease); fi
            gh release create "${TAG}" "${assets[@]}" "${args[@]}"
          fi
