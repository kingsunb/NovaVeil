name: release

# 已禁用自动触发——此工作流构建全平台 (含 Android) + 4 架构安全扫描 + GitHub Release,
# 耗时 120+ 分钟。普通 push 只跑 test + docker-publish。
# 需要发布正式 release 时手动触发 (workflow_dispatch), 确保版本号已更新。
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  build:
    name: Build, test, and scan exact release images
    if: github.repository == 'kingsunb/NovaVeil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      candidate_tag: ${{ steps.version.outputs.candidate_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t version_lines < <(grep -E '^// Version v[0-9]+\.[0-9]+\.[0-9]+$' main.go || true)
          if [ "${#version_lines[@]}" -ne 1 ]; then
            echo 'main.go must contain exactly one // Version vX.Y.Z line' >&2
            exit 1
          fi
          version="${version_lines[0]#// Version }"
          if git show-ref --verify --quiet "refs/tags/${version}"; then
            tagged_sha="$(git rev-list -n1 "${version}")"
            if [ "${tagged_sha}" != "${GITHUB_SHA}" ]; then
              echo "tag ${version} points to ${tagged_sha}, not ${GITHUB_SHA}" >&2
              exit 1
            fi
          fi
          echo "version=${version}" >>"${GITHUB_OUTPUT}"
          echo "candidate_tag=candidate-${GITHUB_SHA}" >>"${GITHUB_OUTPUT}"

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: true

      - name: Scan repository for secrets
        run: |
          trivy fs \
            --scanners secret \
            --exit-code 1 \
            --no-progress \
            --skip-dirs .git \
            --skip-dirs web-next/node_modules \
            --skip-dirs build \
            --skip-dirs static/out \
            .

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0 (peeled commit)
        with:
          version: '11.21.0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Validate scripts and Compose
        env:
          NOVAVEIL_IMAGE: ghcr.io/kingsunb/novaveil:${{ steps.version.outputs.version }}
          NOVAVEIL_WEB_NEXT_IMAGE: ghcr.io/kingsunb/novaveil-web-next:${{ steps.version.outputs.version }}
        run: |
          bash -n \
            scripts/build.sh \
            scripts/build-image-archives.sh \
            scripts/verify-image-archives.sh \
            scripts/verify-release-archive.sh
          sh -n scripts/dockerfile/entrypoint.sh scripts/smoke-test-image.sh
          node --check scripts/licenses/check-reports.mjs
          node --check scripts/licenses/go-module-report.mjs
          node --check scripts/licenses/normalize-frontend-report.mjs
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.local.yml config --quiet

      - name: Setup Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        with:
          ndk-version: r28c

      - name: Test frontend
        # 构建前先跑 vitest：前端回归在进入发布构建前就失败（借鉴 NovaVeil_api 3e4e815）。
        working-directory: web-next
        run: |
          pnpm install --frozen-lockfile
          pnpm run test

      - name: Build all release targets
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: bash scripts/build.sh --targets all --include-android

      - name: Test Go packages
        run: go test -count=1 ./...

      - name: Verify release artifacts
        run: |
          expected=(
            novaveil-linux-amd64.zip novaveil-linux-arm64.zip novaveil-linux-arm.zip novaveil-linux-386.zip
            novaveil-windows-amd64.zip novaveil-darwin-arm64.zip novaveil-darwin-amd64.zip
            novaveil-android-amd64.zip novaveil-android-arm64.zip novaveil-android-arm.zip novaveil-android-386.zip
          )
          scripts/verify-release-archive.sh build/archives/novaveil-linux-amd64.zip build/archives/SHA256SUMS
          cd build/archives
          for archive in "${expected[@]}"; do
            test -f "${archive}" || { echo "missing release archive: ${archive}" >&2; exit 1; }
          done
          test "$(find . -maxdepth 1 -name 'novaveil-*.zip' -type f | wc -l)" -eq "${#expected[@]}"
          sha256sum -c SHA256SUMS
          for archive in "${expected[@]}"; do
            unzip -l "${archive}" | grep -q 'LICENSE'
            unzip -l "${archive}" | grep -q 'THIRD_PARTY_LICENSES.csv'
            unzip -l "${archive}" | grep -q 'THIRD_PARTY_LICENSES.frontend.json'
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build exact release image archives
        run: scripts/build-image-archives.sh build/image-archives "${GITHUB_SHA}" "${{ steps.version.outputs.version }}"

      - name: Scan and smoke test exact release images
        run: scripts/verify-image-archives.sh build/image-archives

      - name: Stage verified release bundle
        run: |
          set -euo pipefail
          rm -rf release-bundle
          mkdir -p release-bundle/build
          cp -a build/archives build/image-archives release-bundle/build/
          cp build/THIRD_PARTY_LICENSES.csv build/THIRD_PARTY_LICENSES.frontend.json release-bundle/build/
          cp LICENSE release-bundle/
          printf '%s\n' "${GITHUB_SHA}" >release-bundle/SOURCE_SHA
          printf '%s\n' "${{ steps.version.outputs.version }}" >release-bundle/RELEASE_VERSION
          (
            cd release-bundle
            find . -type f ! -name MANIFEST.sha256 -print0 \
              | sort -z \
              | xargs -0 sha256sum >MANIFEST.sha256
            sha256sum -c MANIFEST.sha256
          )

      - name: Upload verified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: novaveil-release-${{ github.sha }}
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          path: release-bundle/**

  publish:
    name: Publish exact scanned release images
    needs: build
    if: github.repository == 'kingsunb/NovaVeil' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write
      packages: write
    steps:
      - name: Download verified release bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: novaveil-release-${{ github.sha }}
          path: release-bundle

      - name: Verify release bundle
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          cd release-bundle
          sha256sum -c MANIFEST.sha256
          test "$(cat SOURCE_SHA)" = "${GITHUB_SHA}"
          test "$(cat RELEASE_VERSION)" = "${VERSION}"
          cd build/image-archives
          sha256sum -c PUBLISH.sha256
          test "$(cat SOURCE_SHA)" = "${GITHUB_SHA}"
          test "$(cat IMAGE_VERSION)" = "${VERSION}"
          test "$(wc -l <IMAGES.tsv)" -eq 4
          test "$(wc -l <IMAGE_IDS.tsv)" -eq 4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish only scanned candidate platform images
        env:
          IMAGE: ghcr.io/kingsunb/novaveil
          CANDIDATE: ${{ needs.build.outputs.candidate_tag }}
        run: |
          set -euo pipefail
          refs=()
          while IFS=$'\t' read -r slug platform archive local_ref; do
            docker load --input "release-bundle/build/image-archives/${archive}" >/dev/null
            actual_id="$(docker image inspect "${local_ref}" --format '{{.Id}}')"
            expected_id="$(awk -F '\t' -v slug="${slug}" '$1 == slug { print $5 }' release-bundle/build/image-archives/IMAGE_IDS.tsv)"
            test -n "${expected_id}"
            test "${actual_id}" = "${expected_id}"
            remote_ref="${IMAGE}:${CANDIDATE}-${slug}"
            docker tag "${local_ref}" "${remote_ref}"
            docker push "${remote_ref}"
            remote_digest="$(docker buildx imagetools inspect "${remote_ref}" --format '{{json .Manifest}}' | jq -r .digest)"
            test "${remote_digest}" != null
            test -n "${remote_digest}"
            refs+=("${IMAGE}@${remote_digest}")
          done <release-bundle/build/image-archives/IMAGES.tsv
          test "${#refs[@]}" -eq 4
          docker buildx imagetools create --tag "${IMAGE}:${CANDIDATE}" "${refs[@]}"
          docker buildx imagetools inspect "${IMAGE}:${CANDIDATE}"

      - name: Publish or verify Git tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" >/dev/null 2>&1; then
            tagged_sha="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${VERSION}" --jq .sha)"
            test "${tagged_sha}" = "${GITHUB_SHA}" || {
              echo "tag ${VERSION} points to ${tagged_sha}, not ${GITHUB_SHA}" >&2
              exit 1
            }
          else
            tag_object="$(gh api --method POST "repos/${GITHUB_REPOSITORY}/git/tags" \
              -f tag="${VERSION}" \
              -f message="Release ${VERSION}" \
              -f object="${GITHUB_SHA}" \
              -f type=commit \
              --jq .sha)"
            gh api --method POST "repos/${GITHUB_REPOSITORY}/git/refs" \
              -f ref="refs/tags/${VERSION}" \
              -f sha="${tag_object}"
          fi

      - name: Upload GitHub release
        uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          tag_name: ${{ needs.build.outputs.version }}
          prerelease: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-bundle/build/archives/*

      - name: Promote exact scanned candidate manifest
        env:
          IMAGE: ghcr.io/kingsunb/novaveil
          CANDIDATE: ${{ needs.build.outputs.candidate_tag }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE}:${VERSION}" \
            --tag "${IMAGE}:sha-${GITHUB_SHA::7}" \
            "${IMAGE}:${CANDIDATE}"
