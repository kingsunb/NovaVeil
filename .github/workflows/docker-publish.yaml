name: docker-publish

# 默认发布流程：push 到 main 时先跑测试门禁，再构建 4 平台镜像归档并做
# Trivy 漏洞扫描 + CycloneDX SBOM + 运行时 smoke；全部通过后才推送
# 已验证的 amd64/arm64 归档到 GHCR。正式 Release 暂不启用。

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs/**"
      - ".agents/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR 要求镜像名全小写
  IMAGE: ghcr.io/kingsunb/novaveil

jobs:
  test-gate:
    name: Test, vet, and typecheck gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0 (peeled commit)
        with:
          version: '11.21.0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Typecheck and test frontend
        working-directory: web-next
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm run test

      - name: Test and vet Go packages
        run: |
          go test -count=1 -timeout=10m ./...
          go vet ./...

  build-verify-publish:
    name: Build, verify, and publish Docker image
    needs: test-gate
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          sha_short="${GITHUB_SHA::7}"
          echo "version=dev-${sha_short}" >>"${GITHUB_OUTPUT}"
          echo "sha_short=${sha_short}" >>"${GITHUB_OUTPUT}"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '11.21.0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.27.3'
          cache: true

      - name: Setup Trivy
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.74.0
          cache: true

      - name: Scan repository for secrets
        run: |
          trivy fs \
            --scanners secret \
            --exit-code 1 \
            --no-progress \
            --skip-dirs .git \
            --skip-dirs web-next/node_modules \
            --skip-dirs build \
            --skip-dirs static/out \
            .

      - name: Build frontend, Go binaries, and license reports
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bash scripts/build.sh --targets linux/amd64,linux/386,linux/arm64,linux/arm --no-archive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Build exact platform image archives
        run: scripts/build-image-archives.sh build/image-archives "${GITHUB_SHA}" "${{ steps.meta.outputs.version }}"

      - name: Scan and smoke test exact platform images
        run: scripts/verify-image-archives.sh build/image-archives

      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified image archives
        env:
          DOCKER_CLI_EXPERIMENTAL: enabled
        run: |
          set -euo pipefail
          cd build/image-archives
          sha256sum -c PUBLISH.sha256
          short="${{ steps.meta.outputs.sha_short }}"
          for arch in amd64 arm64; do
            docker load --input "novaveil-linux-${arch}.tar"
            docker tag "novaveil-candidate:${arch}" "${IMAGE}:sha-${short}-${arch}"
            docker push "${IMAGE}:sha-${short}-${arch}"
          done
          docker manifest create "${IMAGE}:sha-${short}" \
            "${IMAGE}:sha-${short}-amd64" "${IMAGE}:sha-${short}-arm64"
          docker manifest push "${IMAGE}:sha-${short}"
          docker manifest create "${IMAGE}:latest" \
            "${IMAGE}:sha-${short}-amd64" "${IMAGE}:sha-${short}-arm64"
          docker manifest push "${IMAGE}:latest"
          docker buildx imagetools inspect "${IMAGE}:sha-${short}"

      - name: Upload image audit artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: novaveil-image-audit-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            build/image-archives/**
            build/THIRD_PARTY_LICENSES.csv
            build/THIRD_PARTY_LICENSES.frontend.json

