name: docker-publish

# 默认构建流程：push 到 main 时构建并推送多架构 Docker 镜像到 GHCR。
# 正式 Release / GitHub Release 暂不启用。

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

env:
  # GHCR 要求镜像名全小写
  IMAGE: ghcr.io/kingsunb/novaveil

jobs:
  build-and-publish:
    name: Build & publish Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Determine version and tags
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          sha_short="${GITHUB_SHA::7}"
          echo "version=dev-${sha_short}" >>"${GITHUB_OUTPUT}"
          echo "image_tags=${IMAGE}:latest,${IMAGE}:sha-${sha_short}" >>"${GITHUB_OUTPUT}"

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0
        with:
          version: '11.21.0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Build frontend and Go binaries
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          bash scripts/build.sh --targets linux/amd64,linux/arm64 --no-archive

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Login to GitHub Container Registry
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 # v3.5.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/dockerfile/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.image_tags }}
          labels: |
            org.opencontainers.image.title=NovaVeil
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

