name: security-scan

# 供应链安全基线：周频 + 手动触发。
# - Go: go vet 是离线可保证的 SAST 基线。
# - 前端: pnpm audit 审计 web-next 生产依赖。
# 后续 runner 允许安装外部工具时，可在本 job 追加：
#   gosec ./...           # Go SAST
#   golangci-lint run     # lint 兜底
#   govulncheck ./...     # Go 漏洞数据库扫描
# 注意：pnpm audit 需要解析 lockfile；web-next/pnpm-lock.yaml 已跟踪并在 CI 使用。

on:
  schedule:
    # 每周一 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-and-audit:
    name: Go vet + pnpm audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version: '1.26.7'
          cache: true

      - name: Setup pnpm
        uses: pnpm/action-setup@a7487c7e89a18df4991f7f222e4898a00d66ddda # v4.1.0 (peeled commit)
        with:
          version: '11.21.0'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.19.0'
          cache: pnpm
          cache-dependency-path: web-next/pnpm-lock.yaml

      - name: Go vet (SAST baseline)
        run: go vet ./...

      - name: Frontend dependency audit
        working-directory: web-next
        run: |
          pnpm install --frozen-lockfile
          pnpm audit --audit-level=high