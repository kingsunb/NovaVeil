name: Verify Agent Notes

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Verify note tree, format, and archive seals
        env:
          # HEAD is a no-op on a clean checkout. Compare against the pre-change
          # commit: PR base, or the previous tip of the pushed branch.
          AGENT_NOTE_ARCHIVE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        # 根 package.json 无 lockfile 且未声明 tsx devDependency；
        # 这里固定 tsx 精确版本，避免 npx 每次拉取 latest 导致门禁漂移。
        run: |
          npx --yes tsx@4.23.15 scripts/agent-notes/verify-agent-note-tree.ts
          npx --yes tsx@4.23.15 scripts/agent-notes/verify-agent-note-format.ts
          npx --yes tsx@4.23.15 scripts/agent-notes/verify-archived-agent-notes.ts
